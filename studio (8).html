button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
.wrap{max-width:1180px;margin:auto;padding:calc(env(safe-area-inset-top) + 16px) 16px 60px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.brand{font-weight:900;letter-spacing:.17em;font-size:14px;flex:1}.brand b{color:var(--accent)}.brand small{display:block;letter-spacing:.12em;font-size:10px;color:var(--muted);font-weight:700}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:10px 15px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:7px;justify-content:center}
.btn.pri{background:var(--accent);color:var(--on);border-color:transparent}
.btn.bad{color:var(--bad)}
.btn.sm{padding:7px 11px;font-size:12px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.ib{width:34px;height:34px;padding:0;border-radius:10px}
svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
h1{font-size:26px;letter-spacing:-.04em;margin:0 0 4px}h2{font-size:16px;margin:0 0 12px}h3{margin:0;font-size:17px;letter-spacing:-.02em}
.muted{color:var(--muted)}code{background:#ffffff12;padding:1px 6px;border-radius:6px;font-size:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0 20px}
.sum div{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}.sum b{display:block;font-size:22px;letter-spacing:-.03em}.sum span{color:var(--muted);font-size:12px}
.bar{height:6px;background:#ffffff14;border-radius:9px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.ev{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:9px}
.swatch{display:flex;height:10px;border-radius:9px;overflow:hidden;border:1px solid #ffffff22}.swatch i{flex:1}.swatch i:first-child{background:var(--a)}.swatch i:last-child{background:var(--b)}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{font-size:11px;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--muted)}
.chip.ok{color:var(--accent);border-color:#d6fa7255}.chip.off{color:var(--bad);border-color:#ff8f7a55}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.empty{border:1px dashed var(--line);border-radius:18px;padding:34px 20px;text-align:center;color:var(--muted)}
/* login */
.login{max-width:380px;margin:12vh auto 0}.login .panel{padding:26px}
label{display:block;font-size:11px;letter-spacing:.1em;color:var(--muted);margin:14px 0 6px;font-weight:700;text-transform:uppercase}
input[type=text],input[type=password],input[type=date],input[type=datetime-local],input[type=number],select,textarea{width:100%;background:#0f1010;border:1px solid var(--line);border-radius:12px;padding:11px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:64px}
input[type=color]{width:100%;height:42px;border:1px solid var(--line);border-radius:12px;background:#0f1010;padding:3px}
.err{color:var(--bad);font-size:12px;min-height:18px;margin-top:8px}
/* editor */
.edit{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:900px){.edit{grid-template-columns:minmax(0,1fr) 380px}.sticky{position:sticky;top:16px;align-self:start}}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tog{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid #ffffff0d}.tog:first-of-type{border-top:0}
.tog input{width:18px;height:18px;accent-color:var(--accent);flex:none}.tog span{flex:1}.tog small{display:block;color:var(--muted);font-size:12px}
.chk{display:flex;flex-wrap:wrap;gap:8px}.chk label{margin:0;display:flex;align-items:center;gap:7px;font-size:13px;letter-spacing:0;text-transform:none;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-weight:600}
.chk input{accent-color:var(--accent)}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.pvbox{background:#0b0c0c;border:1px solid var(--line);border-radius:20px;padding:14px;text-align:center}
.pvbox canvas{max-width:100%;border-radius:12px;background:#000}
.seg{display:inline-flex;background:var(--panel2);border-radius:999px;padding:3px;margin-bottom:10px}.seg button{border:0;background:none;padding:6px 16px;border-radius:999px;font-weight:700;font-size:12px;color:var(--muted)}.seg button.on{background:#fff;color:#111}
.file{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.file img{height:40px;max-width:120px;object-fit:contain;background:#ffffff14;border-radius:8px;padding:3px}
.savebar{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 35%);padding:22px 0 calc(env(safe-area-inset-bottom) + 8px);display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
/* media */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.mt{position:relative;border-radius:12px;overflow:hidden;background:#222;aspect-ratio:4/5}.mt img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.mt.strip img{object-fit:contain;background:#111}
.mt .bd{position:absolute;left:6px;top:6px;background:#000a;border-radius:999px;font-size:10px;padding:2px 8px;font-weight:800}
.mt .by{position:absolute;left:0;right:0;bottom:0;padding:16px 8px 6px;font-size:11px;background:linear-gradient(transparent,#000c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:44px}
.mt .del{position:absolute;right:5px;bottom:5px;background:#000b;border:0;color:#fff;border-radius:9px;width:32px;height:32px;display:grid;place-items:center}
/* modal */
.modal{position:fixed;inset:0;background:#000d;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:22px;width:min(100%,460px);text-align:center}
.mbox img,.mbox video{max-width:100%;max-height:70vh;border-radius:14px}
.qr{background:#fff;border-radius:16px;padding:14px;display:inline-block;margin:12px 0}.qr img{display:block}
.linkrow{display:flex;gap:6px;margin:8px 0;text-align:left}.linkrow input{flex:1;min-width:0;font-size:12px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);transform:translate(-50%,10px);background:#fff;color:#111;border-radius:999px;padding:10px 18px;font-weight:700;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:99;max-width:90vw;text-align:center}.toast.on{opacity:1;transform:translate(-50%,0)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid #fff6;border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>

function normBrand(b){

  o.filters=(Array.isArray(o.filters)&&o.filters.length)?o.filters.filter(id=>FILTERS.some(f=>f[0]===id)):FILTERS.map(f=>f[0]);

/* ---------- auth ---------- */
async function boot(){
  if(!CONFIGURED){S.view='boot';$('#app').innerHTML='<div class="login"><div class="panel"><h2>Konfigurasi belum diisi</h2><p class="muted">Buka <code>studio.html</code> lalu isi <code>SB_URL</code> dan <code>SB_KEY</code> (dan hal yang sama di <code>booth.html</code>) dengan data project Supabase photobooth.</p></div></div>';return}
  const {data:{session}}=await sb.auth.getSession();
  if(session&&await checkAdmin(session.user.id)){await loadAll();S.view='list'}else S.view='login';
  render();
}
async function checkAdmin(uid){
  const {data}=await sb.rpc('pb_is_admin');
  if(data===true){S.user={id:uid};return true}
  return false;
}
async function login(){
  const u=$('#lu').value.trim().toLowerCase(),p=$('#lp').value,er=$('#le');
  if(!u||!p){er.textContent='Isi email & password.';return}
  er.textContent='';
  const {data,error}=await sb.auth.signInWithPassword({email:u,password:p});
  if(error){er.textContent='Email atau password salah.';return}
  if(!await checkAdmin(data.user.id)){await sb.auth.signOut();er.textContent='Akun ini belum didaftarkan sebagai admin Studio.';return}
  await loadAll();S.view='list';render();
}
async function logout(){await sb.auth.signOut();S.user=null;S.view='login';render()}

/* ---------- data ---------- */
async function loadAll(){
  const [e,s]=await Promise.all([sb.from('pb_events').select('*').order('created_at',{ascending:false}),sb.rpc('pb_stats')]);
  S.events=e.data||[];S.stats={};(s.data||[]).forEach(r=>S.stats[r.event_id]={total:+r.total,bytes:+r.bytes});
  if(e.error)toast('Gagal memuat event: '+e.error.message);
}

/* ---------- render ---------- */

  const app=$('#app');

  if(S.view==='login'){
    app.innerHTML=`<div class="login"><div class="brand" style="margin-bottom:18px"><img src="${BRAND.lock_dark}" alt="digitalin photolive" style="height:40px;display:block"><small style="margin-top:6px">STUDIO</small></div><div class="panel">

      <label>Password</label><input type="password" id="lp" autocomplete="current-password">

async function save(){
  const name=D.name.trim(),slug=slugify(D.slug);
  if(!name)return toast('Isi nama event');
  if(!/^[a-z0-9][a-z0-9-]{1,40}$/.test(slug))return toast('Kode link minimal 2 karakter (huruf kecil, angka, strip)');
  if(!D.modes.length)return toast('Pilih minimal satu mode kamera');
  if(!D.filters.length)return toast('Pilih minimal satu filter');
  const btn=$('#saveBtn');btn.disabled=true;btn.innerHTML='<span class="spin"></span> Menyimpan…';
  try{
    const id=D.id||uuid(),old=D.id?evById(D.id):null,oldB=old?normBrand(old.brand):{};
    const up=async(file,kind)=>{
      const ext=file.type==='image/jpeg'?'jpg':file.type==='image/webp'?'webp':'png',path=`${id}/${kind}-${Date.now()}.${ext}`;
      const r=await sb.storage.from('pb-assets').upload(path,file,{contentType:file.type,cacheControl:'31536000'});
      if(r.error)throw new Error('Upload '+kind+' gagal: '+r.error.message);return path;
    };
    let logo=D.logo,frame_png=D.frame_png,strip_frame=D.strip_frame;
    if(PF.logo)logo=await up(PF.logo,'logo');
    if(PF.frame)frame_png=await up(PF.frame,'frame');
    if(PF.strip)strip_frame=await up(PF.strip,'strip');
    const b=draftBrand();b.logo=logo||null;b.frame_png=frame_png||null;b.strip_frame=strip_frame||null;b.strip_slots=b.strip_frame?((PF.strip||oldB.strip_layout!==b.strip_layout)?presetSlots(b.strip_layout):(oldB.strip_slots||presetSlots(b.strip_layout))):null;
    const row={slug,name,event_date:D.event_date||null,brand:b,active:D.active,album_public:D.album_public,close_at:fromLocalInput(D.close_at),reveal_at:fromLocalInput(D.reveal_at)};
    const res=D.id?await sb.from('pb_events').update(row).eq('id',id):await sb.from('pb_events').insert({id,...row});
    if(res.error)throw new Error(/duplicate|unique/i.test(res.error.message)?'Kode link sudah dipakai event lain. Ganti kode lain.':res.error.message);
    // hapus file lama yang sudah diganti ATAU dihapus (biar storage tidak numpuk)
    const keep=[b.logo,b.frame_png,b.strip_frame],stale=[oldB.logo,oldB.frame_png,oldB.strip_frame].filter(p=>p&&!keep.includes(p));
    if(stale.length)sb.storage.from('pb-assets').remove(stale).catch(()=>{});
    PF={logo:null,frame:null,strip:null};await loadAll();S.view='list';render();toast('Event tersimpan ✓');
  }catch(e){toast(e.message||'Gagal menyimpan');const bb=$('#saveBtn');if(bb){bb.disabled=false;bb.textContent='Simpan event'}}
}

function dlTemplate(){

  x.fillStyle='#f3f1ea';x.fillRect(0,0,W,H);

  x.fillStyle='rgba(255,196,0,.28)';x.fillRect(0,0,W,T);x.fillRect(0,B,W,H-B);
  x.setLineDash([16,10]);x.lineWidth=4;x.strokeStyle='#d99a00';x.beginPath();x.moveTo(0,T);x.lineTo(W,T);x.moveTo(0,B);x.lineTo(W,B);x.stroke();x.setLineDash([]);
  x.textAlign='center';x.fillStyle='#8a6200';x.font=`800 26px ${FONT}`;
  x.fillText('ZONA ATAS · tertutup nama & progress bar Story',W/2,150);x.font=`600 22px ${FONT}`;x.fillText('boleh dekorasi, hindari teks penting',W/2,186);
  x.font=`800 26px ${FONT}`;x.fillText('ZONA BAWAH · tertutup kolom balas Story',W/2,B+120);x.font=`600 22px ${FONT}`;x.fillText('boleh dekorasi, hindari teks penting',W/2,B+156);
  x.fillStyle='#111';x.font=`800 24px ${FONT}`;x.fillText(`DIGITALIN PHOTOLIVE · TEMPLATE STRIP ${D&&D.strip_layout==='z4'?'4 FOTO ZIG-ZAG':'3 FOTO'} · 1080 × 1920 px`,W/2,56);
  const z4=D&&D.strip_layout==='z4',SL=presetSlots(z4?'z4':'v3');
  x.fillStyle='rgba(30,170,90,.16)';x.fillStyle='rgba(30,170,90,.16)';
  if(z4){[[60,256,460,150],[560,1396,460,176]].forEach(([a,b2,w2,h2])=>{x.fillRect(a,b2,w2,h2);x.fillStyle='#167a40';x.font=`900 24px ${FONT}`;x.fillText('AREA AMAN: judul, logo, tanggal',a+w2/2,b2+h2/2+4);x.fillStyle='rgba(30,170,90,.16)'})}
  else{const sx=SL[0].x,ex=sx+SL[0].w;x.fillRect(0,T,sx-24,B-T);x.fillRect(ex+24,T,W-ex-24,B-T);
  [[(sx-24)/2,-1],[(ex+24+W)/2,1]].forEach(([cx,dir])=>{x.save();x.translate(cx,(T+B)/2);x.rotate(dir*Math.PI/2);x.fillStyle='#167a40';x.font=`900 34px ${FONT}`;x.fillText('AREA AMAN: judul, logo, tanggal',0,-6);x.font=`600 22px ${FONT}`;x.fillText('terlihat jelas saat dibagikan ke Story',0,28);x.restore()})}
  SL.forEach((sl,i)=>{
    x.fillStyle='rgba(255,77,109,.22)';x.fillRect(sl.x,sl.y,sl.w,sl.h);
    x.setLineDash([18,12]);x.lineWidth=5;x.strokeStyle='#ff4d6d';x.strokeRect(sl.x+3,sl.y+3,sl.w-6,sl.h-6);x.setLineDash([]);
    x.fillStyle='#d61f45';x.font=`900 64px ${FONT}`;x.fillText('FOTO '+(i+1),sl.x+sl.w/2,sl.y+sl.h/2+4);
    x.font=`700 24px ${FONT}`;x.fillText(`${sl.w} × ${sl.h} px · x ${sl.x}, y ${sl.y}`,sl.x+sl.w/2,sl.y+sl.h/2+46);
    x.font=`600 20px ${FONT}`;x.fillText('harus TRANSPARAN',sl.x+sl.w/2,sl.y+sl.h/2+80);
  });
  x.fillStyle='#444';x.font=`600 22px ${FONT}`;x.fillText('Hapus template ini dari desain akhir sebelum export PNG',W/2,H-40);
  return c;
}

  // footer
  x.font=`600 24px ${FONT}`;x.fillStyle=rgba(T,.45);x.fillText('Tanpa install aplikasi · '+boothUrl(e.slug).replace(/^https?:\/\//,''),W/2,H-(logo&&brand.credit?110:84));
  if(logo&&brand.credit){x.font=`900 22px ${FONT}`;x.fillStyle=rgba(T,.35);x.fillText('POWERED BY DIGITALIN PHOTOLIVE',W/2,H-72)}
  brand=prevB;C=prevC;
  return c;
}
function dlQR(id){
  const e=evById(id),c=cardCache[id];if(!c)return toast('Kartu belum siap');
  c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`kartu-qr-${e.slug}.png`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)},'image/png');
}

/* ---------- media / moderasi ---------- */
const PAGE=60;
async function openMedia(id){
  M={ev:evById(id),items:[],more:true,loading:false,count:S.stats[id]?S.stats[id].total:0};S.view='media';render();await moreMedia();
}
async function moreMedia(){
  if(M.loading)return;M.loading=true;
  const {data,error}=await sb.from('pb_media').select('*').eq('event_id',M.ev.id).order('created_at',{ascending:false}).range(M.items.length,M.items.length+PAGE-1);
  M.loading=false;if(error)return toast('Gagal memuat: '+error.message);
  M.items.push(...data);M.more=data.length===PAGE;renderMedia();
}
function renderMedia(){
  if(S.view!=='media')return;const e=M.ev;
  $('#app').innerHTML=top('ALBUM',`<button class="btn sm ib" data-a="back" aria-label="Kembali">${ICON.back}</button>`)+`
  <div style="display:flex;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:14px"><div style="flex:1"><h1>${esc(e.name)}</h1><div class="muted">${M.count} momen · moderasi: hapus foto yang tidak pantas.</div></div>
  <button class="btn pri" data-a="zip" id="zipBtn">${ICON.dl}Unduh semua (ZIP)</button></div>
  ${M.items.length?`<div class="mgrid">${M.items.map((m,i)=>`<div class="mt ${m.kind==='strip'?'strip':''}"><img loading="lazy" src="${mediaUrl(thumbOf(m.path))}" alt="" data-a="view" data-id="${i}" onerror="this.onerror=null;this.src='${mediaUrl(m.path)}'">${m.kind!=='photo'?`<span class="bd">${m.kind==='video'?'▶ VIDEO':'STRIP'}</span>`:''}<span class="by">${esc(m.guest_name||'Tamu')}</span><button class="del" title="Hapus" aria-label="Hapus" data-a="delm" data-id="${i}">${ICON.trash}</button></div>`).join('')}</div>
  ${M.more?'<div style="text-align:center;margin-top:14px"><button class="btn" data-a="morem">Muat lebih banyak</button></div>':''}`:'<div class="empty">Belum ada foto atau video di event ini.</div>'}`;
}
function viewMedia(i){
  const m=M.items[i],u=mediaUrl(m.path);
  modal(`${m.kind==='video'?`<video src="${u}" controls autoplay playsinline></video>`:`<img src="${u}" alt="">`}<div class="muted" style="margin:10px 0">${esc(m.guest_name||'Tamu')} · ${new Date(m.created_at).toLocaleString('id-ID')}</div><div class="acts" style="justify-content:center"><a class="btn sm" href="${u}" target="_blank" rel="noopener">Buka asli</a><button class="btn sm" data-a="closem">Tutup</button></div>`);
}
async function delMedia(i){
  const m=M.items[i];if(!m||!confirm('Hapus foto/video ini dari album? Tidak bisa dibatalkan.'))return;
  const r=await sb.from('pb_media').delete().eq('id',m.id);if(r.error)return toast('Gagal hapus: '+r.error.message);
  sb.storage.from('pb-media').remove([m.path,thumbOf(m.path)]).catch(()=>{});
  M.items.splice(i,1);M.count=Math.max(0,M.count-1);if(S.stats[M.ev.id])S.stats[M.ev.id].total=M.count;renderMedia();toast('Dihapus ✓');
}
async function zipAll(){
  const btn=$('#zipBtn');btn.disabled=true;
  try{
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');
    if(!window.JSZip)throw new Error('Library ZIP gagal dimuat');
    const rows=[];let from=0;
    for(;;){const {data,error}=await sb.from('pb_media').select('*').eq('event_id',M.ev.id).order('created_at').range(from,from+499);if(error)throw error;rows.push(...data);if(data.length<500)break;from+=500}
    if(!rows.length)throw new Error('Belum ada media');
    const zip=new JSZip();let done=0;
    for(const m of rows){
      btn.innerHTML=`<span class="spin"></span> Mengambil ${done+1}/${rows.length}`;
      try{const r=await fetch(mediaUrl(m.path));if(r.ok){const ext=m.path.split('.').pop();zip.file(`${String(done+1).padStart(4,'0')}-${slugify(m.guest_name||'tamu')||'tamu'}-${m.kind}.${ext}`,await r.blob())}}catch(e){}
      done++;
    }
    btn.innerHTML='<span class="spin"></span> Membuat ZIP…';
    const blob=await zip.generateAsync({type:'blob',compression:'STORE'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${M.ev.slug}-album.zip`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),8000);
    toast('ZIP siap diunduh ✓');
  }catch(e){toast(e.message||'Gagal membuat ZIP')}
  const b2=$('#zipBtn');if(b2){b2.disabled=false;b2.innerHTML=`${ICON.dl}Unduh semua (ZIP)`}
}

/* ---------- hapus event ---------- */
async function delEvent(id){
  const e=evById(id);
  if(!confirm(`Hapus event "${e.name}" beserta SEMUA foto & videonya? Tidak bisa dibatalkan.\n\nTips: unduh ZIP album dulu kalau masih dibutuhkan.`))return;
  toast('Menghapus…');
  try{
    for(let n=0;n<20;n++){
      const {data}=await sb.storage.from('pb-media').list(id,{limit:1000});
      if(!data||!data.length)break;
      await sb.storage.from('pb-media').remove(data.map(f=>`${id}/${f.name}`));
    }
    const {data:as}=await sb.storage.from('pb-assets').list(id,{limit:100});
    if(as&&as.length)await sb.storage.from('pb-assets').remove(as.map(f=>`${id}/${f.name}`));
    const r=await sb.from('pb_events').delete().eq('id',id);if(r.error)throw r.error;
    await loadAll();render();toast('Event dihapus ✓');
  }catch(err){toast('Gagal menghapus: '+(err.message||err))}
}

/* ---------- aksi ---------- */
const ACT={
  login,logout,
  new:async()=>{D=newDraft();PF={logo:null,frame:null,strip:null};A={logo:null,frame:null,strip:null};prevMode='photo';S.view='edit';render()},
  edit:async id=>{D=draftOf(evById(id));PF={logo:null,frame:null,strip:null};prevMode='photo';[A.logo,A.frame,A.strip]=await Promise.all([loadImg(assetUrl(D.logo)),loadImg(assetUrl(D.frame_png)),loadImg(assetUrl(D.strip_frame))]);S.view='edit';render()},
  back:async()=>{S.view='list';M=null;D=null;await loadAll();render()},
  save,
  pv:m=>{prevMode=m;$$('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.id===m));drawPreview()},
  rmlogo:()=>{PF.logo=null;D.logo=null;A.logo=null;renderEditKeep()},
  clr:k=>{if(D){D[k]='';renderEditKeep()}},
  rmstrip:()=>{PF.strip=null;D.strip_frame=null;A.strip=null;renderEditKeep()},
  tpl:()=>dlTemplateFile(),
  link:showLink,dlqr:dlQR,closem:closeModal,
  copy:async id=>{const i=$('#'+id);try{await navigator.clipboard.writeText(i.value);toast('Link disalin ✓')}catch(e){i.select();document.execCommand('copy');toast('Link disalin ✓')}},
  media:openMedia,morem:moreMedia,view:i=>viewMedia(+i),delm:i=>delMedia(+i),zip:zipAll,del:delEvent
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const f=ACT[b.dataset.a];if(f){e.preventDefault();f(b.dataset.id,b)}});
if(sb)sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'&&S.view!=='login'){S.user=null;S.view='login';render()}});
boot();
})();
</script>
