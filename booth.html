button,input{font:inherit;color:inherit}button{cursor:pointer}
.screen{position:fixed;inset:0;display:none;flex-direction:column;background:var(--bg)}
.screen.on{display:flex}
.brand{font-weight:900;letter-spacing:.17em;font-size:13px}
.brand b{color:var(--accent)}
.eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-weight:800}
.ibtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:rgba(0,0,0,.45);backdrop-filter:blur(10px);display:grid;place-items:center;padding:0;flex:none}
.ibtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn{border:1px solid var(--line);background:var(--soft);border-radius:14px;padding:13px 16px;font-weight:700;font-size:14px}
.btn.pri{background:var(--accent);color:var(--on);border-color:transparent}
.btn:disabled{opacity:.4}

/* ---------- join / fail ---------- */
.center{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto;background:radial-gradient(ellipse at 50% 20%,color-mix(in srgb,var(--accent) 14%,var(--bg)) 0,var(--bg) 62%)}
.card{width:min(100%,420px);border:1px solid var(--line);background:color-mix(in srgb,var(--bg) 88%,#fff 6%);border-radius:28px;padding:28px 22px;box-shadow:0 25px 80px #0007}
.card .logo{max-height:56px;max-width:60%;object-fit:contain;display:block;margin-bottom:26px}
.card h1{font-size:38px;line-height:1;letter-spacing:-.05em;margin:12px 0}
.card p{color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 6px}
.card label{display:block;font-size:11px;letter-spacing:.12em;color:var(--muted);margin:22px 0 8px}
.name-input{width:100%;border:1px solid var(--line);background:var(--soft);border-radius:14px;padding:15px;font-size:16px;outline:none}
.name-input:focus{border-color:var(--accent)}
.card .btn{width:100%;margin-top:12px}
.note{font-size:12px;color:var(--muted);line-height:1.55;margin-top:14px;display:flex;gap:8px}
.err{min-height:18px;color:#ffb29a;font-size:12px;margin-top:8px}

/* ---------- camera ---------- */
#sCam{background:#070807}
.ctop{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 14px 8px}
.ctop .mid{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.ctop img{height:26px;max-width:90px;object-fit:contain}
.who{font-size:12px;color:#fff;background:rgba(255,255,255,.1);border-radius:999px;padding:7px 12px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stagewrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.stage{position:relative;background:#111;overflow:hidden;border-radius:18px}
.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.camph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:10px;background:radial-gradient(ellipse at 50% 38%,#3b4236 0,#1c201c 70%);font-size:13px;color:#d0d4c8}
.flip{position:absolute;right:10px;top:10px}
.cd{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-shadow:0 4px 30px #000a}
.cd b{font-size:min(34vw,170px);font-weight:900;line-height:1}
.cd b.pop{animation:pop 1s ease-out}
.cd span{font-size:14px;letter-spacing:.18em;text-transform:uppercase;font-weight:800;margin-bottom:6px}
@keyframes pop{0%{transform:scale(1.7);opacity:0}25%{opacity:1}100%{transform:scale(.9);opacity:.85}}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.flash.go{animation:fl .45s ease-out}
@keyframes fl{0%{opacity:.95}100%{opacity:0}}
.dots{position:absolute;left:0;right:0;top:12px;display:flex;justify-content:center;gap:7px}
.dots i{width:9px;height:9px;border-radius:50%;border:2px solid #fff;opacity:.9}
.dots i.f{background:var(--accent);border-color:var(--accent)}
.rectag{position:absolute;left:12px;top:14px;background:rgba(0,0,0,.6);border-radius:999px;padding:6px 11px;font-size:12px;font-weight:800;letter-spacing:.06em;display:flex;gap:7px;align-items:center}
.rectag:before{content:"";width:8px;height:8px;border-radius:50%;background:#ff4d4d;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.2}}
.cbot{padding:8px 0 calc(env(safe-area-inset-bottom) + 12px)}
.modes{display:flex;justify-content:center;gap:6px;margin-bottom:10px}
.modes button{border:0;background:transparent;color:#fff9;font-weight:800;font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:8px 14px;border-radius:999px}
.modes button.on{background:#fff;color:#111}
.fwrap{position:relative;margin-bottom:2px}
.dial{position:relative;height:104px;overflow:hidden;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-mask-image:linear-gradient(90deg,transparent 2%,#000 24%,#000 76%,transparent 98%);mask-image:linear-gradient(90deg,transparent 2%,#000 24%,#000 76%,transparent 98%)}
.dial:active{cursor:grabbing}
.dialPin{position:absolute;left:50%;top:0;margin-left:-1.5px;width:3px;height:22px;border-radius:3px;background:var(--accent);box-shadow:0 0 12px color-mix(in srgb,var(--accent) 70%,transparent);z-index:2}
.dialRot{position:absolute;left:50%;top:6px;border-radius:50%;background:radial-gradient(circle closest-side,#0b0c0b calc(100% - 58px),#191b19 calc(100% - 58px),#121412);box-shadow:inset 0 0 0 1px #ffffff1f;will-change:transform}
.dialRot.snap{transition:transform .55s cubic-bezier(.18,1.25,.35,1)}
.dTicks,.dMajor{position:absolute;inset:0;border-radius:50%;pointer-events:none}
.dTicks{-webkit-mask-image:radial-gradient(circle closest-side,transparent calc(100% - 8px),#000 calc(100% - 8px));mask-image:radial-gradient(circle closest-side,transparent calc(100% - 8px),#000 calc(100% - 8px))}
.dMajor{-webkit-mask-image:radial-gradient(circle closest-side,transparent calc(100% - 15px),#000 calc(100% - 15px));mask-image:radial-gradient(circle closest-side,transparent calc(100% - 15px),#000 calc(100% - 15px))}
.ditem{position:absolute;left:50%;top:50%;width:110px;height:24px;margin:-12px 0 0 -55px;display:flex;align-items:center;justify-content:center;border:0;background:none;padding:0;pointer-events:none;transition:opacity .15s}
.ditem span{display:inline-block;color:#fff;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;transition:transform .25s cubic-bezier(.3,1.6,.5,1),color .2s,text-shadow .2s}
.ditem.on span{color:var(--accent);transform:scale(1.3);text-shadow:0 0 18px color-mix(in srgb,var(--accent) 55%,transparent)}
.flabel{display:none}
.fname{position:absolute;left:0;right:0;top:42%;text-align:center;font-size:clamp(26px,7vw,40px);font-weight:900;letter-spacing:-.03em;text-shadow:0 4px 28px #000b;opacity:0;pointer-events:none}
.fname.go{animation:fn 1.1s ease-out}
@keyframes fn{0%{opacity:0;transform:scale(.85)}18%{opacity:1;transform:scale(1)}70%{opacity:1}100%{opacity:0}}
.ctrl{display:grid;grid-template-columns:1fr 84px 1fr;align-items:center;padding:0 22px}
.ctrl .l{justify-self:start}.ctrl .r{justify-self:end}
.shutter{--p:0;width:78px;height:78px;border-radius:50%;border:0;padding:6px;background:conic-gradient(var(--accent) calc(var(--p)*1%),#ffffff55 0);display:grid;place-items:center;justify-self:center}
.shutter i{display:block;width:100%;height:100%;border-radius:50%;background:#fff;border:3px solid #070807;transition:all .15s}
.shutter.video i{background:#ff4d4d}
.shutter.rec i{border-radius:14px;transform:scale(.55)}
.shutter:disabled{opacity:.35}
.thumbbtn{width:46px;height:46px;border-radius:12px;border:2px solid #ffffff66;background:#222 center/cover;padding:0;overflow:hidden;display:grid;place-items:center}
.roll{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border:1px solid #ffffff1f;border-radius:14px;padding:4px 12px 4px 10px;height:58px;color:#fff}
.roll svg{width:18px;height:18px;stroke:#ffffff99;fill:none;stroke-width:1.6;stroke-linecap:round}
.rn{display:flex;flex-direction:column;align-items:center;font-family:Georgia,"Times New Roman",serif;font-style:italic;line-height:1.05;min-width:30px}
.rn i{font-size:11px;font-style:italic;opacity:.35;min-height:12px}.rn b{font-size:25px;font-weight:700}
.roll.tick .rn{animation:ru .45s ease-out}@keyframes ru{from{transform:translateY(14px);opacity:.2}to{transform:none;opacity:1}}
.roll.empty b{color:#ff8f7a}.shutter.out{opacity:.35}
.tleft{font-size:11px;font-weight:700;color:var(--accent);white-space:nowrap}
.zoom{position:absolute;left:50%;bottom:24%;transform:translateX(-50%);display:flex;gap:2px;background:rgba(0,0,0,.45);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:999px;padding:3px;z-index:3}
.zoom button{border:0;background:none;color:#fff;font-size:12px;font-weight:800;width:38px;height:38px;border-radius:50%;padding:0}
.zoom button.on{background:rgba(255,255,255,.18);color:var(--accent)}
.thumbbtn svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:1.8}
.status{text-align:center;font-size:12px;color:var(--accent);min-height:18px;margin-top:10px;padding:0 16px}

/* ---------- result sheet ---------- */
#sheet{position:fixed;inset:0;z-index:40;background:rgba(5,6,5,.94);display:none;flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:14px}
#sheet.on{display:flex}
#shMedia{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;width:100%}
#shMedia img,#shMedia video{max-width:100%;max-height:100%;border-radius:16px;box-shadow:0 20px 60px #000a}
.upstate{font-size:13px;font-weight:700;min-height:20px;text-align:center}
.upstate.ok{color:var(--accent)}.upstate.bad{color:#ffb29a}
.shbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:min(100%,460px);padding-bottom:env(safe-area-inset-bottom)}
.shbtns .btn{flex:1 1 40%}
.spin{display:inline-block;width:12px;height:12px;border:2px solid #fff6;border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- album ---------- */
.atop{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 14px 8px}
.atop .t{flex:1;min-width:0}.atop h2{margin:0;font-size:18px;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.atop small{color:var(--muted);font-size:12px}
.tabs{display:flex;gap:6px;padding:4px 14px 10px}
.tabs button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 16px;font-weight:700;font-size:12px;color:var(--muted)}
.tabs button.on{background:var(--accent);border-color:transparent;color:var(--on)}
.ascroll{flex:1;overflow:auto;padding:0 12px calc(env(safe-area-inset-bottom) + 20px)}
.agrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media(min-width:700px){.agrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{position:relative;border:0;padding:0;border-radius:14px;overflow:hidden;background:#222;aspect-ratio:4/5;display:block;width:100%}
.tile img,.tile video{width:100%;height:100%;object-fit:cover;display:block}
.tile.strip img{object-fit:contain;background:#111}
.tile .bd{position:absolute;right:7px;top:7px;background:#000a;border-radius:999px;font-size:10px;padding:3px 8px;font-weight:800}
.tile .by{position:absolute;left:0;right:0;bottom:0;padding:18px 9px 7px;text-align:left;font-size:11px;font-weight:700;background:linear-gradient(transparent,#000b);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{grid-column:1/-1;border:1px dashed var(--line);border-radius:16px;padding:30px 20px;text-align:center;color:var(--muted);font-size:13px;line-height:1.6}
#aMore{display:block;margin:14px auto 0}
.lock{padding:42px 20px}.lock .ic{font-size:40px;line-height:1;margin-bottom:12px}.lock b{display:block;color:var(--text);font-size:15px}
.cdown{font-size:clamp(30px,9vw,46px);font-weight:900;letter-spacing:-.03em;color:var(--accent);margin:12px 0 8px;font-variant-numeric:tabular-nums}
.wlock{text-align:center;color:#fff}.wlock .t{font-size:clamp(18px,2.4vw,30px);font-weight:800;opacity:.85}.wlock .cdown{font-size:clamp(56px,10vw,140px);margin:16px 0}

/* ---------- lightbox ---------- */
#lb{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.96);display:none;flex-direction:column;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 56px) 14px calc(env(safe-area-inset-bottom) + 14px);gap:12px}
#lb.on{display:flex}
#lbMedia{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
#lbMedia img,#lbMedia video{max-width:100%;max-height:100%;border-radius:14px}
#lbCap{font-size:13px;color:#ddd}
.lbx{position:absolute;right:14px;top:calc(env(safe-area-inset-top) + 10px)}
.lbn{position:absolute;top:50%;transform:translateY(-50%)}
.lbn.p{left:8px}.lbn.n{right:8px}

/* ---------- wall ---------- */
#sWall{background:#000}
#wallBg{position:absolute;inset:0;background:center/cover;filter:blur(40px) brightness(.45);transform:scale(1.15)}
#wallMedia{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:4vh 4vw}
#wallMedia img,#wallMedia video{max-width:100%;max-height:100%;border-radius:22px;box-shadow:0 30px 100px #000c;animation:wi .8s ease-out}
@keyframes wi{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.wtop{position:absolute;left:3vw;top:3vh;display:flex;align-items:center;gap:14px;z-index:2}
.wtop img{height:7vh;max-width:22vw;object-fit:contain}
.wtop h1{margin:0;font-size:clamp(18px,3vw,38px);letter-spacing:-.03em}
.wqr{position:absolute;right:3vw;bottom:3vh;z-index:2;background:#fff;border-radius:18px;padding:12px;text-align:center;color:#111;font-size:12px;font-weight:800}
.wqr div{display:flex;justify-content:center}
.wby{position:absolute;left:3vw;bottom:3vh;z-index:2;font-size:clamp(14px,2vw,24px);font-weight:800;text-shadow:0 2px 12px #000}
.wnew{position:absolute;top:3vh;right:3vw;z-index:2;background:var(--accent);color:var(--on);border-radius:999px;padding:8px 16px;font-weight:900;letter-spacing:.1em;font-size:13px}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 90px);transform:translate(-50%,10px);background:#fff;color:#111;border-radius:999px;padding:10px 18px;font-size:13px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;z-index:90;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<!-- loading -->
<section class="screen on" id="sLoad"><div class="center"><div class="card" style="text-align:center"><img class="blogo" alt="digitalin photolive" style="height:40px;display:block;margin:0 auto"><p style="margin-top:14px"><span class="spin"></span>Menyiapkan photobooth…</p></div></div></section>

<!-- gagal / event tidak ada -->
<section class="screen" id="sFail"><div class="center"><div class="card"><img class="blogo" alt="digitalin photolive" style="height:40px;display:block;margin:0 auto"><h1 id="failT" style="font-size:28px">Ups.</h1><p id="failM"></p></div></div></section>

<!-- join -->
<section class="screen" id="sJoin"><div class="center"><div class="card">
  <img class="logo" id="jLogo" alt="" hidden>
  <div class="eyebrow" id="jTag"></div>
  <h1 id="jTitle"></h1>
  <p id="jDesc">Masukkan nama dulu, lalu pilih filter favoritmu dan ambil momennya.</p>
  <form id="jForm">
    <label for="jName">NAMA / NAMA PANGGILAN</label>
    <input class="name-input" id="jName" maxlength="40" placeholder="Contoh: Alya" autocomplete="given-name">
    <div class="err" id="jErr" role="status"></div>
    <button class="btn pri" type="submit" id="jGo">Masuk ke kamera →</button>
  </form>
  <button class="btn" id="jAlbum" type="button" hidden>Lihat album event</button>
  <div class="note" id="jNote"><span>ⓘ</span><span>Foto dan video yang kamu ambil akan masuk ke album event ini.</span></div>
</div></div></section>

<!-- kamera -->
<section class="screen" id="sCam">
  <header class="ctop">
    <div class="mid"><img id="cLogo" alt="" hidden><div class="who" id="who"></div><span class="tleft" id="tLeft" hidden></span></div>
    <button class="ibtn" id="bUp" aria-label="Unggah dari galeri" hidden><svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg></button>
    <button class="ibtn" id="bAlbumTop" aria-label="Album"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.8"/><path d="m4 18 5-5 4 4 3-3 4 4"/></svg></button>
  </header>
  <div class="stagewrap" id="swrap">
    <div class="stage" id="stage">
      <video id="cam" playsinline muted autoplay></video>
      <canvas id="frameCv" width="1080" height="1350"></canvas>
      <div class="dots" id="dots"></div>
      <div class="rectag" id="recTag" hidden>REC 0:00</div>
      <div class="fname" id="fname"></div>
      <div class="cd" id="cd"></div>
      <div class="flash" id="flash"></div>
      <button class="ibtn flip" id="flip" aria-label="Ganti kamera"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5M21 12a9 9 0 0 1-15 6.7L3 16M3 21v-5h5"/></svg></button>
      <div class="zoom" id="zoom"><button data-z="1" class="on">1x</button><button data-z="2">2x</button></div>
      <div class="camph" id="camPh"><span id="camPhT">Menyiapkan kamera…</span><button class="btn" id="camRetry" hidden>Coba buka kamera</button></div>
    </div>
  </div>
  <footer class="cbot">
    <div class="modes" id="modes"></div>
    <div class="fwrap" id="fwrap"><div class="flabel" id="flabel"></div><div class="dial" id="dial"><i class="dialPin"></i><div class="dialRot" id="dialRot"></div></div></div>
    <div class="ctrl">
      <div class="l"><div class="roll" id="roll" hidden aria-label="Sisa jatah foto"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 8h4M3 12h4M3 16h4M17 8h4M17 12h4M17 16h4"/></svg><div class="rn"><i id="rUp"></i><b id="rNow"></b><i id="rDn"></i></div></div></div>
      <button class="shutter" id="shutter" aria-label="Ambil" disabled><i></i></button>
      <div class="r"><button class="thumbbtn" id="bAlbum" aria-label="Album"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.8"/><path d="m4 18 5-5 4 4 3-3 4 4"/></svg></button></div>
    </div>
    <div class="status" id="status" role="status"></div>
    <input type="file" id="fileIn" accept="image/*" hidden>
  </footer>
</section>

<!-- hasil -->
<div id="sheet" role="dialog" aria-label="Hasil">
  <div id="shMedia"></div>
  <div class="upstate" id="upState"></div>
  <div class="shbtns">
    <button class="btn pri" id="shSave">Unduh</button>
    <button class="btn" id="shShare" hidden>Bagikan</button>
    <button class="btn" id="shSend" hidden>Kirim ke album</button>
    <button class="btn" id="shRetry" hidden>Coba kirim lagi</button>
    <button class="btn" id="shAgain">Ulangi</button>
  </div>
</div>

<!-- album -->
<section class="screen" id="sAlbum">
  <header class="atop">
    <button class="ibtn" id="aBack" aria-label="Kembali"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="t"><h2 id="aTitle">Album</h2><small id="aSub"></small></div>
    <button class="ibtn" id="aRefresh" aria-label="Muat ulang"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5M21 12a9 9 0 0 1-15 6.7L3 16M3 21v-5h5"/></svg></button>
  </header>
  <div class="tabs" id="aTabs"><button data-t="all" class="on">Semua</button><button data-t="mine">Punyaku</button></div>
  <div class="ascroll"><div class="agrid" id="aGrid"></div><button class="btn" id="aMore" hidden>Muat lebih banyak</button></div>
</section>

<!-- lightbox -->
<div id="lb" role="dialog" aria-label="Pratinjau">
  <button class="ibtn lbx" id="lbX" aria-label="Tutup"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  <button class="ibtn lbn p" id="lbP" aria-label="Sebelumnya"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <button class="ibtn lbn n" id="lbN" aria-label="Berikutnya"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  <div id="lbMedia"></div><div id="lbCap"></div>
  <div class="shbtns"><button class="btn pri" id="lbDl">Unduh</button><button class="btn" id="lbSh" hidden>Bagikan</button></div>
</div>

const DEF={accent:'#defa3c',bg:'#121313',title:'Namamu.\nMomenmu.',tagline:'Your event, through their lens',frame:'footer',countdown:3,modes:['photo','strip','video'],video_max:10,auto_upload:true,mirror:true,credit:true,allow_upload:false,filters:null,logo:null,frame_png:null,strip_frame:null,strip_slots:null,shots_max:0,strip_layout:'v3'};

function normBrand(b){
  const o={...DEF,...(b||{})};
  o.accent=hex(o.accent)||DEF.accent;o.bg=hex(o.bg)||DEF.bg;
  o.countdown=[0,3,5].includes(+o.countdown)?+o.countdown:3;
  o.modes=(Array.isArray(o.modes)?o.modes:DEF.modes).filter(m=>['photo','strip','video'].includes(m));if(!o.modes.length)o.modes=['photo'];
  o.video_max=Math.min(30,Math.max(3,+o.video_max||10));
  o.filters=(Array.isArray(o.filters)&&o.filters.length)?o.filters.filter(id=>FILTERS.some(f=>f.id===id)):FILTERS.map(f=>f.id);
  if(!o.filters.length)o.filters=['natural'];
  o.frame=['none','footer','border','custom'].includes(o.frame)?o.frame:'footer';
  o.shots_max=Math.min(500,Math.max(0,parseInt(o.shots_max)||0));

function rr(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}

function drawBar(x,X,Y,W,H,u,pad){
  x.save();const cy=Y+H/2;let rightW=0;
  if(A.logo){const lh=Math.min(H*.6,120*u);let lw=lh*A.logo.width/A.logo.height;const mw=W*.3;const s=lw>mw?mw/lw:1;const dw=lw*s,dh=lh*s;x.drawImage(A.logo,X+W-pad-dw,cy-dh/2,dw,dh);rightW=dw+24*u}

  if(sub){x.font=`600 ${27*u}px ${FONT}`;x.fillStyle=C.accent;x.fillText(ell(x,sub,maxW),X+pad,cy+42*u)}

}
function drawFrame(x,w,h){

async function countdown(n,label){
  const el=$('#cd');
  for(let i=n;i>0;i--){el.innerHTML=(label?`<span>${esc(label)}</span>`:'')+`<b class="pop">${i}</b>`;await sleep(1000)}
  el.innerHTML='';
}
function flash(){const f=$('#flash');f.classList.remove('go');void f.offsetWidth;f.classList.add('go');navigator.vibrate&&navigator.vibrate(25)}
function dots(n,f){$('#dots').innerHTML=n>1?Array.from({length:n},(_,i)=>`<i class="${i<f?'f':''}"></i>`).join(''):''}

async function shoot(){
  st='count';const v=$('#cam'),mirror=facing==='user'&&brand.mirror,strip=mode==='strip',cus=strip&&!!A.strip,sl=cus?stripSlots():null,n=strip?(cus?sl.length:defStripSlots().length):1,shots=[];
  try{
    dots(n,0);
    for(let i=0;i<n;i++){
      await countdown(brand.countdown,strip?`Foto ${i+1} dari ${n}`:'');
      flash();
      shots.push(cus?grab(v,sl[i].w,sl[i].h,mirror):strip?grab(v,defStripSlots()[i].w,defStripSlots()[i].h,mirror):grab(v,1080,1350,mirror));
      dots(n,i+1);
      if(i<n-1)await sleep(1100);
    }
    const c=cus?composeStripCustom(shots):strip?composeStrip(shots):composePhoto(shots[0]);
    const [blob,thumb]=await Promise.all([blobOf(c,.85),makeThumb(c)]);
    showResult({kind:strip?'strip':'photo',blob,thumb});
  }catch(e){toast('Gagal mengambil foto')}
  dots(0,0);st='idle';
}
async function fromFile(f){
  try{
    const url=URL.createObjectURL(f),img=await loadImg(url);URL.revokeObjectURL(url);
    if(!img)return toast('File gambar tidak bisa dibaca');
    const c=grab(img,1080,1350,false);composePhoto(c);
    const [blob,thumb]=await Promise.all([blobOf(c,.85),makeThumb(c)]);
    showResult({kind:'photo',blob,thumb});
  }catch(e){toast('Gagal memproses gambar')}
}

/* ---------- video ---------- */
let rec=null;
async function startRec(){
  if(!window.MediaRecorder)return toast('Browser ini belum mendukung rekam video');
  st='count';
  try{
    if(brand.countdown)await countdown(brand.countdown,'Bersiap rekam');
    let aTrack=null;
    try{if(!audioStream)audioStream=await navigator.mediaDevices.getUserMedia({audio:true});aTrack=audioStream.getAudioTracks()[0]}catch(e){}
    const v=$('#cam'),W=720,H=900,rc=mk(W,H),rx=rc.getContext('2d'),mirror=facing==='user'&&brand.mirror,f=curFilter();
    let live=true;
    const paint=()=>{if(!live)return;if(CTXF)rx.filter=f.css;drawCover(rx,v,W,H,mirror,.42,digZ);if(CTXF)rx.filter='none';drawFrame(rx,W,H);loop()};
    const loop=()=>v.requestVideoFrameCallback?v.requestVideoFrameCallback(paint):requestAnimationFrame(paint);
    paint();
    let out;
    if(rc.captureStream){out=rc.captureStream(30);if(aTrack)out.addTrack(aTrack)}
    else out=new MediaStream([...stream.getVideoTracks(),...(aTrack?[aTrack]:[])]);
    const mt=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(t=>MediaRecorder.isTypeSupported(t));
    const mr=new MediaRecorder(out,{...(mt?{mimeType:mt}:{}),videoBitsPerSecond:2500000}),chunks=[];
    let thumbP=null;setTimeout(()=>{if(live)thumbP=makeThumb(rc)},700);
    mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
    const t0=Date.now(),tag=$('#recTag'),sh=$('#shutter');
    tag.hidden=false;sh.classList.add('rec');
    const tick=setInterval(()=>{
      const s=(Date.now()-t0)/1000;tag.textContent='REC 0:'+String(Math.floor(s)).padStart(2,'0');
      sh.style.setProperty('--p',Math.min(100,s/brand.video_max*100));
      if(s>=brand.video_max)stopRec();
    },200);
    mr.onstop=async()=>{
      live=false;clearInterval(tick);tag.hidden=true;sh.classList.remove('rec');sh.style.setProperty('--p',0);
      const type=(mr.mimeType||mt||'video/webm'),blob=new Blob(chunks,{type});
      rec=null;st='idle';
      if(blob.size<2000)return toast('Rekaman terlalu pendek');
      showResult({kind:'video',blob,thumb:thumbP?await thumbP:null});
    };
    mr.start(500);rec=mr;st='rec';
  }catch(e){st='idle';toast('Perekaman gagal. Periksa izin kamera/mikrofon.')}
}
function stopRec(){if(rec&&rec.state!=='inactive')rec.stop()}

/* ============ HASIL & UPLOAD ============ */
function extOf(it){return it.kind==='video'?(it.blob.type.includes('mp4')?'mp4':'webm'):'jpg'}
function showResult(it){
  if(last&&last.url)URL.revokeObjectURL(last.url);
  last=it;it.url=URL.createObjectURL(it.blob);it.state='idle';
  useShot();
  if(it.thumb){if(lastThumbUrl)URL.revokeObjectURL(lastThumbUrl);lastThumbUrl=URL.createObjectURL(it.thumb);setThumb(lastThumbUrl)}
  const m=$('#shMedia');
  m.innerHTML=it.kind==='video'?`<video src="${it.url}" controls autoplay loop muted playsinline></video>`:`<img src="${it.url}" alt="Hasil foto">`;
  $('#shShare').hidden=!(navigator.canShare&&navigator.canShare({files:[new File([it.blob],'x.'+extOf(it),{type:it.blob.type.split(';')[0]})]}));
  $('#sheet').classList.add('on');
  renderUp();
  if(brand.auto_upload&&(isOpen()||EV.active))doUpload(it);
}
function renderUp(){
  const it=last,u=$('#upState');if(!it)return;
  u.className='upstate';
  $('#shSend').hidden=!(EV.active&&it.state==='idle'&&!brand.auto_upload);
  $('#shRetry').hidden=it.state!=='err';
  if(it.state==='up')u.innerHTML='<span class="spin"></span>Mengunggah ke album…';
  else if(it.state==='ok'){u.className='upstate ok';u.textContent='✓ Sudah masuk album event'}
  else if(it.state==='err'){u.className='upstate bad';u.textContent='Gagal mengunggah. Fotomu aman — unduh dulu atau coba lagi.'+(it.err?' ('+it.err+')':'')}
  else u.textContent='';
}
async function doUpload(it){
  if(it.state==='up'||it.state==='ok')return;
  it.state='up';if(it===last)renderUp();
  try{
    const id=it.id||(it.id=uuid()),path=`${EV.id}/${id}.${extOf(it)}`,ct=(it.blob.type||'image/jpeg').split(';')[0];
    const up=await sb.storage.from('pb-media').upload(path,it.blob,{contentType:ct,cacheControl:'31536000',upsert:false});
    if(up.error&&!/exists|Duplicate/i.test(up.error.message))throw new Error('Storage: '+up.error.message);
    if(it.thumb)await sb.storage.from('pb-media').upload(thumbOf(path),it.thumb,{contentType:'image/jpeg',cacheControl:'31536000',upsert:false}).catch(()=>{});
    const ins=await sb.from('pb_media').insert({id,event_id:EV.id,guest_name:guest||null,kind:it.kind,path,bytes:it.blob.size});
    if(ins.error&&ins.error.code!=='23505')throw new Error('DB: '+ins.error.message);
    it.state='ok';pushMine({id,path,kind:it.kind,t:Date.now(),name:guest});
  }catch(e){console.warn(e);it.state='err';it.err=(e&&(e.message||e.error||e.statusCode))||String(e)}
  if(it===last)renderUp();
}
$('#shSend').onclick=()=>last&&doUpload(last);
$('#shRetry').onclick=()=>{if(last){last.state='idle';doUpload(last)}};
$('#shAgain').onclick=()=>{$('#sheet').classList.remove('on');$('#shMedia').innerHTML='';if(last&&last.url){URL.revokeObjectURL(last.url);last.url=null}};
function fileName(kind,ext){return`${SLUG}-${slugName(guest)}-${Date.now()}.${ext}`}
function saveBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
$('#shSave').onclick=()=>last&&saveBlob(last.blob,fileName(last.kind,extOf(last)));
$('#shShare').onclick=async()=>{if(!last)return;try{await navigator.share({files:[new File([last.blob],fileName(last.kind,extOf(last)),{type:last.blob.type.split(';')[0]})],title:EV.name})}catch(e){}};

/* ============ ALBUM ============ */
let tab='all',albumItems=[],cursor=null,hasMore=false,albumFrom='sJoin',lbList=[],lbI=0;
async function openAlbum(from){
  albumFrom=from;$('#aTitle').textContent=EV.name;
  const pub=EV.album_public;$('#aTabs').hidden=!pub;tab=pub?'all':'mine';
  $$('#aTabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  showScreen('sAlbum');loadAlbum(true);
}
let aT=0;
function closeAlbum(){clearInterval(aT);showScreen(albumFrom);if(albumFrom==='sCam')startCam()}
$('#aBack').onclick=closeAlbum;
$('#aRefresh').onclick=()=>loadAlbum(true);
$('#aTabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;tab=b.dataset.t;$$('#aTabs button').forEach(x=>x.classList.toggle('on',x===b));loadAlbum(true)};
$('#aMore').onclick=()=>loadAlbum(false);
async function loadAlbum(reset){
  const grid=$('#aGrid');
  if(tab==='mine'){
    const a=getMine();albumItems=a.map(m=>({id:m.id,path:m.path,kind:m.kind,guest_name:m.name,created_at:new Date(m.t).toISOString()}));
    hasMore=false;$('#aSub').textContent=a.length+' momen milikmu';renderGrid(a.length?'':'Kamu belum membuat momen di event ini.');return;
  }
  clearInterval(aT);
  if(!isRevealed()){
    albumItems=[];hasMore=false;$('#aMore').hidden=true;$('#aSub').textContent='Terkunci sampai '+fmtDT(EV.reveal_at);
    grid.innerHTML=`<div class="empty lock"><div class="ic">🔒</div><b>Album dibuka ${esc(fmtDT(EV.reveal_at))}</b><div class="cdown" id="aCd">${fmtLeft(tsOf(EV.reveal_at)-Date.now())}</div>Semua foto tamu akan muncul bersamaan. Sementara itu, lihat momenmu di tab <b style="display:inline">Punyaku</b>.</div>`;
    aT=setInterval(()=>{const left=tsOf(EV.reveal_at)-Date.now(),el=$('#aCd');if(el)el.textContent=fmtLeft(left);if(left<=0){clearInterval(aT);setTimeout(()=>loadAlbum(true),1500)}},1000);
    return;
  }
  if(reset){albumItems=[];cursor=null;grid.innerHTML='<div class="empty"><span class="spin"></span>Memuat album…</div>'}
  const {data,error}=await sb.rpc('pb_album',{p_slug:SLUG,p_limit:40,p_before:cursor});
  if(error){grid.innerHTML='<div class="empty">Gagal memuat album. Tarik ke bawah / tekan ↻ untuk coba lagi.</div>';return}
  albumItems.push(...data);hasMore=data.length===40;if(data.length)cursor=data[data.length-1].created_at;
  $('#aSub').textContent=albumItems.length+(hasMore?'+':'')+' momen';
  renderGrid('Belum ada foto. Jadilah yang pertama!');
}
function renderGrid(emptyMsg){
  const g=$('#aGrid');
  g.innerHTML=albumItems.length?albumItems.map((m,i)=>{
    const isV=m.kind==='video',src=mediaUrl(thumbOf(m.path)),full=mediaUrl(m.path);
    return`<button class="tile ${m.kind==='strip'?'strip':''}" data-i="${i}"><img loading="lazy" src="${src}" alt="" onerror="this.onerror=null;${isV?"this.style.display='none'":`this.src='${full}'`}">${isV?'<span class="bd">▶ VIDEO</span>':''}<span class="by">${esc(m.guest_name||'Tamu')}</span></button>`;
  }).join(''):`<div class="empty">${esc(emptyMsg)}</div>`;
  $('#aMore').hidden=!hasMore;
}
$('#aGrid').onclick=e=>{const t=e.target.closest('.tile');if(t)openLb(+t.dataset.i)};
function openLb(i){lbList=albumItems;lbI=i;drawLb();$('#lb').classList.add('on')}
function drawLb(){
  const m=lbList[lbI];if(!m)return;const u=mediaUrl(m.path);
  $('#lbMedia').innerHTML=m.kind==='video'?`<video src="${u}" controls autoplay loop playsinline></video>`:`<img src="${u}" alt="">`;
  $('#lbCap').textContent=(m.guest_name||'Tamu')+' · '+new Date(m.created_at).toLocaleString('id-ID',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
  $('#lbP').hidden=lbI<=0;$('#lbN').hidden=lbI>=lbList.length-1;
  $('#lbSh').hidden=!navigator.canShare;
}
const closeLb=()=>{$('#lb').classList.remove('on');$('#lbMedia').innerHTML=''};
$('#lbX').onclick=closeLb;
$('#lbP').onclick=()=>{lbI--;drawLb()};$('#lbN').onclick=()=>{lbI++;drawLb()};
addEventListener('keydown',e=>{if(!$('#lb').classList.contains('on'))return;if(e.key==='Escape')closeLb();if(e.key==='ArrowLeft'&&lbI>0){lbI--;drawLb()}if(e.key==='ArrowRight'&&lbI<lbList.length-1){lbI++;drawLb()}});
let tx=0;$('#lb').addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
$('#lb').addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>70){if(d<0&&lbI<lbList.length-1){lbI++;drawLb()}else if(d>0&&lbI>0){lbI--;drawLb()}}},{passive:true});
async function lbBlob(){const m=lbList[lbI],r=await fetch(mediaUrl(m.path));if(!r.ok)throw new Error('fetch');return{blob:await r.blob(),m}}
$('#lbDl').onclick=async()=>{try{const {blob,m}=await lbBlob();saveBlob(blob,`${SLUG}-${slugName(m.guest_name)}-${m.id.slice(0,6)}.${m.path.split('.').pop()}`)}catch(e){toast('Gagal mengunduh')}};
$('#lbSh').onclick=async()=>{try{const {blob,m}=await lbBlob();await navigator.share({files:[new File([blob],`${SLUG}-${m.id.slice(0,6)}.${m.path.split('.').pop()}`,{type:blob.type})],title:EV.name})}catch(e){}};

/* ============ LAYAR LIVE (proyektor) ============ */
let wall=[],wi=0,wTimer=null;
function loadScript(src){return new Promise(r=>{const s=document.createElement('script');s.src=src;s.onload=r;s.onerror=r;document.head.appendChild(s)})}
async function startWall(){
  showScreen('sWall');
  if(A.logo){$('#wLogo').src=A.logo.src;$('#wLogo').hidden=false}
  $('#wTitle').textContent=EV.name;
  const url=location.origin+location.pathname+'?e='+SLUG;
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js');
  if(window.QRCode)new QRCode($('#wQr'),{text:url,width:150,height:150,correctLevel:QRCode.CorrectLevel.M});
  await wallPull(true);setInterval(()=>wallPull(false),12000);
}
async function wallPull(first){
  if(!EV.album_public){$('#wallMedia').innerHTML='<div class="empty" style="color:#fff">Album event ini tidak dibuka untuk layar live.</div>';return}
  if(!isRevealed()){
    if(!$('#wCd')){clearTimeout(wTimer);$('#wBy').textContent='';$('#wallBg').style.backgroundImage='';
      $('#wallMedia').innerHTML=`<div class="wlock"><div class="t">Semua foto dibuka ${esc(fmtDT(EV.reveal_at))}</div><div class="cdown" id="wCd"></div><div class="t">Scan QR &amp; ambil momenmu sekarang!</div></div>`;
      const tick=setInterval(()=>{const left=tsOf(EV.reveal_at)-Date.now(),el=$('#wCd');if(el)el.textContent=fmtLeft(left);if(left<=0){clearInterval(tick);wall=[];setTimeout(()=>wallPull(true),1500)}},1000);
      $('#wCd').textContent=fmtLeft(tsOf(EV.reveal_at)-Date.now());}
    return;
  }
  const {data}=await sb.rpc('pb_album',{p_slug:SLUG,p_limit:60,p_before:null});
  if(!data)return;
  const known=new Set(wall.map(x=>x.id)),fresh=data.filter(x=>!known.has(x.id));
  wall=data;
  if(first||fresh.length){wi=0;if(!first){$('#wNew').hidden=false;setTimeout(()=>$('#wNew').hidden=true,5000)}wallShow()}
}
function wallShow(){
  clearTimeout(wTimer);
  if(!wall.length){$('#wallMedia').innerHTML='<div class="empty" style="color:#fff;border-color:#fff4">Menunggu foto pertama… scan QR untuk ikut!</div>';wTimer=setTimeout(()=>wallPull(false),5000);return}
  const m=wall[wi%wall.length],u=mediaUrl(m.path);
  $('#wallMedia').innerHTML=m.kind==='video'?`<video src="${u}" autoplay muted playsinline></video>`:`<img src="${u}" alt="">`;
  $('#wallBg').style.backgroundImage=`url("${mediaUrl(thumbOf(m.path))}")`;
  $('#wBy').textContent=m.guest_name||'';
  const v=$('#wallMedia video');
  const next=()=>{wi++;wallShow()};
  if(v){v.onended=next;wTimer=setTimeout(next,20000)}else wTimer=setTimeout(next,7000);
}

boot();
})();
</script>
