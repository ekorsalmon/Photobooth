<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Undangan Pernikahan</title>
<meta name="theme-color" content="#EDEEE6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  --ground:#EDEEE6; --paper:#F7F7F1; --ink:#23302A; --soft:#5E6B63; --sogan:#8E5F36; --line:#D5D8CC; --live:#B23A2E;
  --pl-ink:#111150; --pl-lime:#E0FF42;
  --display:'Bodoni Moda', Didot, Georgia, serif;
  --body:'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(40px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.card{max-width:560px;margin:0 auto;background:var(--paper);border:1px solid var(--line);border-radius:4px;overflow:hidden}
section.blk{padding:40px 28px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center}
section.blk:first-child{border-top:0}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--sogan)}
h1,h2{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
h1{font-size:clamp(44px,12vw,64px);line-height:1;font-style:italic}
h1 .amp{font-style:normal;color:var(--sogan);font-size:.6em;display:block;margin:6px 0}
h2{font-size:30px;line-height:1.15}
p{margin:0;max-width:44ch}
.muted{color:var(--soft)} .small{font-size:14px}
.kawung{width:120px;height:20px;display:block}
.guest{font-size:13px;color:var(--soft)} .guest b{display:block;font-size:17px;color:var(--ink);margin-top:2px}
.date{font-family:var(--display);font-size:22px}
.count{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:340px;font-variant-numeric:tabular-nums}
.count div,.stats div{border:1px solid var(--line);border-radius:4px;padding:10px 4px;background:#fff}
.count b,.stats b{display:block;font-family:var(--display);font-size:26px;font-weight:400;line-height:1.1}
.count span{font-size:11px;color:var(--soft);letter-spacing:.06em;text-transform:uppercase}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;font-variant-numeric:tabular-nums}
.stats span{font-size:11.5px;color:var(--soft)}
.events{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.ev{border:1px solid var(--line);border-radius:4px;padding:18px 12px;background:#fff;display:flex;flex-direction:column;gap:4px}
.ev .t{font-family:var(--display);font-size:20px} .ev .h{font-weight:700;font-variant-numeric:tabular-nums}
.loc{font-size:14px;color:var(--soft)}
.btn{font:600 14px var(--body);padding:12px 18px;border-radius:999px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:disabled{opacity:.5;cursor:wait}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #7B7BF0;outline-offset:2px}
form.rsvp{width:100%;max-width:380px;display:flex;flex-direction:column;gap:10px;text-align:left}
label{font-size:13px;font-weight:600;display:flex;flex-direction:column;gap:4px}
input,select,textarea{font:400 15px var(--body);padding:11px 12px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--ink)}
textarea{min-height:70px;resize:vertical}
.radio{display:flex;gap:8px}
.radio label{flex:1;flex-direction:row;align-items:center;gap:8px;border:1px solid var(--line);border-radius:4px;padding:10px;background:#fff;font-weight:500}
.err{color:var(--live);font-size:13px}
.qrwrap{display:flex;flex-direction:column;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:4px;padding:20px;width:100%;max-width:300px}
.cap{font-size:12px;color:var(--soft)}
.gift{width:100%;max-width:380px;border:1px solid var(--line);border-radius:4px;background:#fff;padding:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left}
.gift .no{font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:.04em;user-select:all;word-break:break-all}
.wishes{width:100%;display:flex;flex-direction:column;gap:10px;text-align:left}
.wish{border-left:2px solid var(--sogan);padding:4px 0 4px 12px}
.wish b{font-size:14px} .wish p{font-size:14px;color:var(--soft)}
.live{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--live)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--live);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%}
.grid button{all:unset;cursor:pointer;display:block;aspect-ratio:3/4;max-width:100%;background:#ddd;overflow:hidden;border-radius:2px}
.grid img{width:100%;height:100%;object-fit:cover;display:block}
.grid button{position:relative}
.grid .bd{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.6);color:#fff;font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:4px}
.grid .new{animation:pop .6s ease-out}
.lb video{max-width:100%;max-height:78vh;border-radius:4px}
.cta{background:var(--ink);color:var(--paper);border-radius:4px;padding:22px;width:100%;display:flex;flex-direction:column;gap:10px;align-items:center}
.cta .btn{background:#E0FF42;color:#111150;border-color:#E0FF42;font-weight:700}
@keyframes pop{from{transform:scale(.85);opacity:.3}to{transform:none;opacity:1}}
.empty{font-size:14px;color:var(--soft);padding:20px 0}
.foot{padding:22px 28px;background:var(--pl-ink);color:#fff;font-size:12.5px;text-align:center}
.foot b{color:var(--pl-lime)}
.state{max-width:560px;margin:20vh auto 0;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.lb{position:fixed;inset:0;background:rgba(20,26,23,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:30;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lb img{max-width:100%;max-height:78vh;border-radius:4px}
.lb p{color:#E7E9E2;font-size:13px}
.lb .btn{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px);text-align:center;z-index:40}
.toast.show{opacity:1}
[hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){.live i,.grid .new{animation:none}}
</style>
<script src="photolive-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
<main id="app"><div class="state"><p class="muted">Membuka undangan…</p></div></main>
<div class="lb" id="lb" hidden>
  <div id="lb-media"></div>
  <p>Tekan lama foto untuk menyimpan ke HP</p>
  <button class="btn" type="button" id="lb-close">Tutup</button>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const cfg = window.PHOTOLIVE;
const sb = supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY, { auth: { persistSession: false, autoRefreshToken: false } });
const qs = new URLSearchParams(location.search);
const SLUG = (qs.get('e') || '').toLowerCase();
let CODE = (qs.get('to') || '').toLowerCase();
const BOOTH_PAGE = cfg.BOOTH_PAGE || 'booth.html';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = { get(k){ try { return localStorage.getItem(k) } catch { return null } }, set(k,v){ try { localStorage.setItem(k,v) } catch {} } };
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2600); }

if (!CODE && SLUG) CODE = store.get('pl-guest-' + SLUG) || '';

let D = null, album = [], albumState = 'idle', more = false, editing = false;
const mediaUrl = p => sb.storage.from('pb-media').getPublicUrl(p).data.publicUrl;
const thumbOf = p => p.replace(/\.[^.\/]+$/, '_t.jpg');
const pbSlug = () => (D.event.pb_slug || '').toLowerCase();

const kawung = `<svg class="kawung" viewBox="0 0 120 20" aria-hidden="true"><g fill="none" stroke="#8E5F36" stroke-width="1.2"><line x1="0" y1="10" x2="40" y2="10"/><line x1="80" y1="10" x2="120" y2="10"/><ellipse cx="54" cy="10" rx="6" ry="4"/><ellipse cx="66" cy="10" rx="6" ry="4"/><ellipse cx="60" cy="4" rx="4" ry="6"/><ellipse cx="60" cy="16" rx="4" ry="6"/></g></svg>`;

function stateMsg(title, text){
  $('#app').innerHTML = `<div class="state"><h2>${esc(title)}</h2><p class="muted">${esc(text)}</p></div>`;
}

/* ---------- blok-blok halaman ---------- */
function hero(e, g, phase){
  const top = phase==='after' ? 'Terima kasih' : phase==='day' ? 'Hari ini' : 'The Wedding of';
  return `<section class="blk"><div class="eyebrow">${top}</div>
    <h1>${esc(e.name_a)}<span class="amp">&amp;</span>${esc(e.name_b)}</h1>${kawung}
    ${e.date_text ? `<div class="date">${esc(e.date_text)}</div>` : ''}
    ${phase==='before' && g ? `<div class="guest">Kepada Yth.<b>${esc(g.name)}</b></div>` : ''}
    ${phase==='before' && e.quote ? `<p class="muted small">${esc(e.quote)}</p>` : ''}
    ${phase==='after' ? `<p class="muted">Terima kasih atas doa dan kehadirannya. Semua foto dari booth tersimpan di halaman ini.</p>` : ''}
  </section>`;
}
const countdown = () => `<section class="blk"><div class="eyebrow">Menuju hari bahagia</div><div class="count" id="count"></div></section>`;
function tickCount(){
  const el = $('#count'); if (!el || !D.event.event_at) return;
  const s = Math.max(0, Math.floor((Date.parse(D.event.event_at) - Date.now()) / 1000));
  const v = [Math.floor(s/86400), Math.floor(s%86400/3600), Math.floor(s%3600/60), s%60];
  el.innerHTML = ['Hari','Jam','Menit','Detik'].map((l,i) => `<div><b>${v[i]}</b><span>${l}</span></div>`).join('');
}
function couple(e){
  if (!e.full_a && !e.full_b) return '';
  return `<section class="blk"><div class="eyebrow">Mempelai</div>
    <h2>${esc(e.full_a || e.name_a)}</h2>${e.parents_a ? `<p class="muted small">${esc(e.parents_a)}</p>` : ''}
    <div class="date" style="color:var(--sogan)">&amp;</div>
    <h2>${esc(e.full_b || e.name_b)}</h2>${e.parents_b ? `<p class="muted small">${esc(e.parents_b)}</p>` : ''}</section>`;
}
function events(e){
  const evs = [['Akad Nikah', e.akad_time], ['Resepsi', e.resepsi_time]].filter(x => x[1]);
  const maps = e.maps_url && /^https:\/\//.test(e.maps_url) ? e.maps_url
    : (e.venue ? 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent((e.venue||'') + ' ' + (e.address||'')) : null);
  return `<section class="blk"><div class="eyebrow">Rangkaian acara</div>
    ${evs.length ? `<div class="events" style="grid-template-columns:repeat(${evs.length},1fr)">${evs.map(x => `<div class="ev"><span class="t">${x[0]}</span><span class="h">${esc(x[1])}</span></div>`).join('')}</div>` : ''}
    ${e.venue ? `<p><b>${esc(e.venue)}</b></p>` : ''}${e.address ? `<p class="loc">${esc(e.address)}</p>` : ''}
    ${maps ? `<a class="btn ghost" href="${esc(maps)}" target="_blank" rel="noopener">Buka peta</a>` : ''}</section>`;
}
function rsvpBlock(e, g){
  if (g && g.rsvp !== 'pending' && !editing) {
    return `<section class="blk"><div class="eyebrow">${g.rsvp==='yes' ? 'QR tamu Anda' : 'Konfirmasi tersimpan'}</div>
      <h2>${g.rsvp==='yes' ? 'Sampai jumpa di hari H' : 'Terima kasih atas kabarnya'}</h2>
      ${g.rsvp==='yes' && g.qr ? `<div class="qrwrap"><div id="qr"></div><div class="cap">${esc(g.name)} · ${g.pax} orang</div></div>
        <p class="muted small">Tunjukkan QR ini di meja tamu. Simpan halaman ini atau screenshot QR-nya.</p>` : ''}
      ${D.phase === 'before' ? `<button class="btn ghost" type="button" id="rsvp-edit">Ubah konfirmasi</button>` : ''}</section>`;
  }
  const pax = g && g.pax ? g.pax : 2;
  return `<section class="blk"><div class="eyebrow">Konfirmasi kehadiran</div><h2>Mohon kabari kami</h2>
    <form class="rsvp" id="rsvp-form" novalidate>
      <label for="r-nama">Nama<input id="r-nama" autocomplete="name" maxlength="80" value="${esc(g ? g.name : '')}"></label>
      <div class="radio" role="radiogroup" aria-label="Kehadiran">
        <label><input type="radio" name="hadir" id="r-ya" value="1" ${!g || g.rsvp !== 'no' ? 'checked' : ''}> Hadir</label>
        <label><input type="radio" name="hadir" id="r-tidak" value="0" ${g && g.rsvp === 'no' ? 'checked' : ''}> Tidak hadir</label>
      </div>
      <label for="r-jml">Jumlah tamu<select id="r-jml">${[1,2,3,4,5].map(n => `<option ${n===pax?'selected':''}>${n}</option>`).join('')}</select></label>
      <label for="r-ucap">Ucapan dan doa<textarea id="r-ucap" maxlength="500" placeholder="Tulis ucapan untuk ${esc(e.name_a)} & ${esc(e.name_b)}"></textarea></label>
      <p class="err" id="r-err" hidden></p>
      <button class="btn" type="submit" id="r-send">Kirim konfirmasi</button>
    </form></section>`;
}
function gift(e){
  if (!e.bank_no) return '';
  return `<section class="blk"><div class="eyebrow">Amplop digital</div>
    <p class="muted small">Doa restu Anda sudah lebih dari cukup. Bagi yang ingin memberi tanda kasih:</p>
    <div class="gift"><div><div class="small muted">${esc(e.bank_name || '')} · a.n. ${esc(e.bank_holder || '')}</div><div class="no" id="rek">${esc(e.bank_no)}</div></div>
    <button class="btn ghost" type="button" id="copy-rek">Salin</button></div></section>`;
}
function wishesBlock(){
  const w = D.wishes || [];
  return `<section class="blk"><div class="eyebrow">Ucapan dan doa · ${D.stats.wishes}</div>
    ${w.length ? `<div class="wishes">${w.slice(0, 8).map(x => `<div class="wish"><b>${esc(x.name)}</b><p>${esc(x.message)}</p></div>`).join('')}</div>`
               : `<p class="empty">Belum ada ucapan. Jadilah yang pertama.</p>`}</section>`;
}
function boothCta(){
  if (!pbSlug()) return '';
  return `<div class="cta"><b>Ikut mengabadikan momen</b>
    <p class="small" style="color:#D9DED7">Ambil foto dengan HP Anda. Fotonya langsung masuk ke galeri ini.</p>
    <a class="btn" href="${esc(BOOTH_PAGE)}?e=${encodeURIComponent(pbSlug())}" target="_blank" rel="noopener">Ambil foto di booth</a></div>`;
}
function gallery(phase){
  const live = phase === 'day';
  return `<section class="blk">
    ${live ? `<span class="live"><i></i>Langsung dari booth</span>` : `<div class="eyebrow">Galeri Photolive</div>`}
    <h2>${live ? 'Foto masuk saat acara berlangsung' : 'Semua foto dari booth'}</h2>
    ${live ? boothCta() : ''}
    <div class="stats">
      <div><b id="st-in">${D.stats.checked_in}</b><span>check-in</span></div>
      <div><b id="st-ph">${album.length}${more ? '+' : ''}</b><span>foto booth</span></div>
      <div><b>${D.stats.wishes}</b><span>ucapan</span></div>
    </div>
    <div class="grid" id="grid"></div>
    <p class="empty" id="g-empty"></p>
    <button class="btn ghost" type="button" id="g-more" hidden>Muat foto lainnya</button>
  </section>`;
}
function tile(m, i, isNew){
  const v = m.kind === 'video';
  return `<button type="button" class="${isNew ? 'new' : ''}" data-i="${i}" aria-label="Buka ${v ? 'video' : 'foto'}">
    <img loading="lazy" src="${esc(mediaUrl(thumbOf(m.path)))}" alt="" onerror="this.onerror=null;${v ? "this.style.display='none'" : `this.src='${esc(mediaUrl(m.path))}'`}">
    ${v ? '<span class="bd">▶ VIDEO</span>' : ''}</button>`;
}
function drawGrid(newIds){
  const g = $('#grid'); if (!g) return;
  g.innerHTML = album.map((m, i) => tile(m, i, newIds && newIds.has(m.id))).join('');
  const em = $('#g-empty');
  em.hidden = album.length > 0;
  em.textContent = albumState === 'closed' ? 'Galeri foto acara ini belum dibuka.'
    : albumState === 'error' ? 'Galeri belum bisa dimuat. Coba lagi sebentar.'
    : D.phase === 'day' ? 'Foto pertama dari booth akan muncul di sini.' : 'Belum ada foto.';
  $('#g-more').hidden = !more || D.phase === 'day';
  const st = $('#st-ph'); if (st) st.textContent = album.length + (more ? '+' : '');
}

/* ---------- render ---------- */
function render(){
  const e = D.event, g = D.guest, phase = D.phase;
  document.title = `${e.name_a} & ${e.name_b}`;
  const hasGallery = !!pbSlug();
  let h = hero(e, g, phase);
  if (phase === 'before') h += countdown() + couple(e) + events(e) + rsvpBlock(e, g) + gift(e) + wishesBlock();
  if (phase === 'day')    h += (hasGallery ? gallery('day') : '') + (g && g.qr ? rsvpBlock(e, g) : '') + events(e) + gift(e) + wishesBlock();
  if (phase === 'after')  h += (hasGallery ? gallery('after') : '') + wishesBlock() + couple(e);
  h += `<div class="foot">Undangan &amp; galeri live by <b>digitalin Photolive</b></div>`;
  $('#app').innerHTML = `<div class="card">${h}</div>`;
  if (phase === 'before') tickCount();
  if ($('#qr') && g && g.qr && window.QRCode) new QRCode($('#qr'), { text: g.qr, width: 180, height: 180, colorDark: '#23302A', colorLight: '#ffffff' });
  drawGrid();
}

/* ---------- data ---------- */
async function loadInvite(){
  const { data, error } = await sb.rpc('wd_invite', { p_slug: SLUG, p_code: CODE || null });
  if (error) throw error;
  return data;
}
const PAGE = 60;
async function loadAlbum(reset){
  if (!pbSlug()) return;
  const before = reset || !album.length ? null : album[album.length - 1].created_at;
  const { data, error } = await sb.rpc('pb_album', { p_slug: pbSlug(), p_limit: PAGE, p_before: before });
  if (error) { albumState = /reveal|public|lock|tutup|privat/i.test(error.message || '') ? 'closed' : 'error'; if (reset) album = []; return; }
  albumState = 'ok';
  if (reset) album = data || []; else album.push(...(data || []));
  more = (data || []).length === PAGE;
}
async function pollAlbum(){           // hari H: ambil foto terbaru tiap 12 detik
  if (D.phase !== 'day' || !pbSlug()) return;
  const known = new Set(album.map(x => x.id));
  const { data, error } = await sb.rpc('pb_album', { p_slug: pbSlug(), p_limit: PAGE, p_before: null });
  if (error || !data) return;
  const fresh = data.filter(x => !known.has(x.id));
  if (!fresh.length) return;
  album = data.concat(album.filter(x => !data.some(d => d.id === x.id))).slice(0, 240);
  albumState = 'ok';
  drawGrid(new Set(fresh.map(x => x.id)));
}
async function refresh(){
  try {
    const nd = await loadInvite(); if (nd.status !== 'ok') return;
    const changed = nd.phase !== D.phase;
    D.stats = nd.stats; if (changed) { D = Object.assign(nd, { guest: D.guest || nd.guest }); await loadAlbum(true); render(); return; }
    const si = $('#st-in'); if (si) si.textContent = D.stats.checked_in;
  } catch {}
}

async function init(){
  if (!SLUG) return stateMsg('Link undangan tidak lengkap', 'Buka undangan dari link yang dikirim mempelai.');
  try {
    D = await loadInvite();
    if (D.status === 'not_found') return stateMsg('Undangan tidak ditemukan', 'Periksa kembali link yang Anda terima.');
    if (D.phase !== 'before') await loadAlbum(true);
    render();
    setInterval(() => { if (D.phase === 'before') tickCount(); }, 1000);
    setInterval(pollAlbum, 12000);
    setInterval(refresh, 60000);
  } catch {
    stateMsg('Undangan belum bisa dibuka', 'Periksa koneksi internet, lalu muat ulang halaman ini.');
  }
}

/* ---------- interaksi ---------- */
$('#app').addEventListener('submit', async ev => {
  if (ev.target.id !== 'rsvp-form') return;
  ev.preventDefault();
  const name = $('#r-nama').value.trim(), attend = $('#r-ya').checked, pax = +$('#r-jml').value, msg = $('#r-ucap').value.trim();
  const err = $('#r-err');
  if (!name) { err.textContent = 'Isi nama Anda dulu.'; err.hidden = false; $('#r-nama').focus(); return; }
  $('#r-send').disabled = true;
  const { data, error } = await sb.rpc('wd_rsvp', { p_slug: SLUG, p_code: CODE || null, p_name: name, p_attend: attend, p_pax: pax, p_message: msg || null });
  if (error || !data || data.status !== 'ok') {
    $('#r-send').disabled = false;
    err.textContent = data && data.status === 'closed' ? 'Konfirmasi sudah ditutup.' : 'Konfirmasi gagal terkirim. Periksa koneksi lalu coba lagi.';
    err.hidden = false; return;
  }
  CODE = data.code; store.set('pl-guest-' + SLUG, CODE);
  D.guest = { code: data.code, name, rsvp: data.rsvp, pax: data.pax, qr: data.qr };
  if (msg) { D.wishes.unshift({ name, message: msg }); D.stats.wishes++; }
  editing = false; render();
  toast(attend ? 'Konfirmasi tersimpan, QR tamu sudah dibuat' : 'Konfirmasi tersimpan');
});
$('#app').addEventListener('click', async ev => {
  const b = ev.target.closest('button'); if (!b) return;
  if (b.id === 'rsvp-edit') { editing = true; render(); return; }
  if (b.id === 'g-more') { b.disabled = true; await loadAlbum(false); drawGrid(); b.disabled = false; return; }
  if (b.id === 'copy-rek') {
    const no = $('#rek').textContent.replace(/\s/g, '');
    try { await navigator.clipboard.writeText(no); toast('Nomor rekening disalin'); }
    catch { const r = document.createRange(); r.selectNodeContents($('#rek')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('Nomor sudah dipilih, salin manual'); }
    return;
  }
  if (b.dataset.i !== undefined) {
    const m = album[+b.dataset.i]; if (!m) return; const u = mediaUrl(m.path);
    $('#lb-media').innerHTML = m.kind === 'video' ? `<video src="${esc(u)}" controls autoplay playsinline></video>` : `<img src="${esc(u)}" alt="Foto dari booth${m.guest_name ? ' oleh ' + esc(m.guest_name) : ''}">`;
    $('#lb').hidden = false; $('#lb-close').focus();
  }
});
function closeLb(){ $('#lb').hidden = true; $('#lb-media').innerHTML = ''; }
$('#lb-close').onclick = closeLb;
$('#lb').addEventListener('click', ev => { if (ev.target.id === 'lb') closeLb(); });
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') closeLb(); });

init();

</script>
</body>
